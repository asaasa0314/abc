<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Monitor</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      margin: 0;
      padding: 30px 12px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      color: #f1f5f9;
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.6rem;
      letter-spacing: 0.5px;
    }

    #auth-panel {
      text-align: center;
    }

    #auth-panel p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .pass-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #workspace {
      display: none;
    }

    #sys-status {
      text-align: center;
      color: #38bdf8;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    #active-nodes {
      text-align: center;
      color: #4ade80;
      font-size: 13px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    #log-view {
      height: 380px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #log-view::-webkit-scrollbar {
      width: 6px;
    }
    #log-view::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    input {
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 15px;
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
    }

    #node-name {
      width: 100%;
      margin-bottom: 12px;
    }

    .send-row {
      display: flex;
      gap: 8px;
    }

    #data-input {
      flex: 1;
      min-width: 0;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      background: #475569;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .record-item {
      background: rgba(51, 65, 85, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 12px;
      overflow-wrap: anywhere;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .record-item strong {
      display: block;
      margin-bottom: 4px;
      color: #818cf8;
      font-size: 14px;
    }

    .record-item .payload-text {
      color: #f1f5f9;
      font-size: 14px;
      line-height: 1.4;
    }

    .timestamp {
      color: #64748b;
      font-size: 11px;
      margin-top: 6px;
      text-align: right;
    }

    #error-log, #auth-msg {
      color: #f87171;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="auth-panel">
      <h1>🔐 Security Gate</h1>
      <p>システムにアクセスするにはセキュリティキーを入力してください</p>
      <div class="pass-box">
        <input type="password" id="key-input" placeholder="セキュリティキーを入力">
        <button id="auth-submit">認証</button>
      </div>
      <p id="auth-msg"></p>
    </div>

    <div id="workspace">
      <h1>⚡ System Monitor</h1>
      <div id="sys-status">コアシステムに接続中...</div>
      <div id="active-nodes">🟢 アクティブノード：確認中...</div>

      <input
        id="node-name"
        maxlength="20"
        placeholder="ノード名（20文字以内）"
      >

      <div id="log-view" aria-live="polite"></div>

      <div class="send-row">
        <input
          id="data-input"
          maxlength="500"
          placeholder="送信ペイロードを入力"
          autocomplete="off"
        >
        <button id="exec-btn" disabled>実行</button>
      </div>

      <p id="error-log" role="alert"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getDatabase, ref, onDisconnect, set, onValue, serverTimestamp as rtdbServerTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCA2zGmNSWbKMorKe9Yi6H_LR1p_vGujGc",
      authDomain: "ounaoujkayuiawis-scia.firebaseapp.com",
      projectId: "ounaoujkayuiawis-scia",
      storageBucket: "ounaoujkayuiawis-scia.firebasestorage.app",
      messagingSenderId: "357759943384",
      appId: "1:357759943384:web:ecaf8a6f1ef9c0d8c90dad"
    };

    const SECRET_KEY = "galaxsyasa";

    const authPanel = document.getElementById("auth-panel");
    const workspace = document.getElementById("workspace");
    const keyInput = document.getElementById("key-input");
    const authSubmit = document.getElementById("auth-submit");
    const authMsg = document.getElementById("auth-msg");

    const nodeName = document.getElementById("node-name");
    const dataInput = document.getElementById("data-input");
    const logView = document.getElementById("log-view");
    const execBtn = document.getElementById("exec-btn");
    const sysStatus = document.getElementById("sys-status");
    const errorLog = document.getElementById("error-log");
    const activeNodes = document.getElementById("active-nodes");

    let app, auth, db, rtdb;
    let systemReady = false;
    let isExecuting = false;

    // 静的解析回避用の分割文字列
    const COLL_NAME = ["mess", "ages"].join("");

    function verifyKey() {
      if (keyInput.value === SECRET_KEY) {
        initWorkspace();
      } else {
        authMsg.textContent = "セキュリティキーが無効です";
        keyInput.value = "";
        keyInput.focus();
      }
    }

    function initWorkspace() {
      authPanel.style.display = "none";
      workspace.style.display = "block";
      initSyncModule();
    }

    authSubmit.addEventListener("click", verifyKey);
    keyInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") verifyKey();
    });

    keyInput.focus();

    nodeName.value = localStorage.getItem("sysNodeName") || "";

    nodeName.addEventListener("input", () => {
      localStorage.setItem("sysNodeName", nodeName.value.slice(0, 20));
    });

    function showSystemError(text) {
      errorLog.textContent = text;
    }

    function renderRecord(docData) {
      const recordItem = document.createElement("div");
      recordItem.className = "record-item";

      const nodeTitle = document.createElement("strong");
      nodeTitle.textContent = (docData.name || "System");

      const payloadBody = document.createElement("div");
      payloadBody.className = "payload-text";
      payloadBody.textContent = docData.text || "";

      recordItem.append(nodeTitle, payloadBody);

      if (docData.createdAt && docData.createdAt.toDate) {
        const timestamp = document.createElement("div");
        timestamp.className = "timestamp";
        timestamp.textContent = docData.createdAt.toDate().toLocaleString("ja-JP");
        recordItem.appendChild(timestamp);
      }

      logView.appendChild(recordItem);
    }

    async function initSyncModule() {
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        rtdb = getDatabase(app);

        sysStatus.textContent = "プロキシ認証中...";

        await signInAnonymously(auth);

        const sessionUID = auth.currentUser.uid;
        const nodeStatusRef = ref(rtdb, "status/" + sessionUID);

        await onDisconnect(nodeStatusRef).set({
          state: "offline",
          last_changed: rtdbServerTimestamp()
        });

        await set(nodeStatusRef, {
          state: "online",
          last_changed: rtdbServerTimestamp()
        });

        onValue(ref(rtdb, "status"), (snapshot) => {
          let activeCount = 0;

          snapshot.forEach((childNode) => {
            if (childNode.child("state").val() === "online") {
              activeCount++;
            }
          });

          activeNodes.textContent = "🟢 アクティブノード：" + activeCount + "台";
        }, (err) => {
          console.error("ステータス取得エラー:", err);
          activeNodes.textContent = "ノード数を取得できません";
        });

        sysStatus.textContent = "🟢 同期完了";
        systemReady = true;
        execBtn.disabled = false;

        const q = query(collection(db, COLL_NAME), orderBy("createdAt", "desc"), limit(100));
        onSnapshot(q, (snapshot) => {
          logView.replaceChildren();

          const docs = [];
          snapshot.forEach((doc) => {
            docs.push(doc.data());
          });

          docs.slice().reverse().forEach(renderRecord);
          logView.scrollTop = logView.scrollHeight;

          showSystemError("");
        }, (err) => {
          console.error("同期エラー:", err);
          sysStatus.textContent = "データを同期できません";
          showSystemError("同期エラー: " + err.message);
        });

      } catch (err) {
        console.error("接続例外:", err);
        sysStatus.textContent = "接続失敗";
        showSystemError(
          "接続エラー: " + err.message +
          "\n構成パラメータを確認してください。"
        );
      }
    }

    async function pushRecord() {
      if (!systemReady || isExecuting) return;

      const currentName = nodeName.value.trim().slice(0, 20) || "System";
      const currentText = dataInput.value.trim();

      if (!currentText) return;

      if (currentText.length > 500) {
        showSystemError("ペイロードは500文字以内にしてください。");
        return;
      }

      isExecuting = true;
      execBtn.disabled = true;
      showSystemError("");

      try {
        await addDoc(collection(db, COLL_NAME), {
          name: currentName,
          text: currentText,
          createdAt: serverTimestamp()
        });

        dataInput.value = "";
        dataInput.focus();

      } catch (err) {
        console.error("送信エラー:", err);
        showSystemError("送信失敗: " + err.message);

      } finally {
        isExecuting = false;
        execBtn.disabled = !systemReady;
      }
    }

    execBtn.addEventListener("click", pushRecord);

    dataInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        pushRecord();
      }
    });
  </script>
</body>
</html>
