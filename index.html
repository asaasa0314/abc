<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Chat</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      margin: 0;
      padding: 30px 12px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      color: #f1f5f9;
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.6rem;
      letter-spacing: 0.5px;
    }

    /* 認証画面 */
    #lock-screen {
      text-align: center;
    }

    #lock-screen p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .pass-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* チャット画面 */
    #chat-screen {
      display: none; /* 初期状態は非表示 */
    }

    #status {
      text-align: center;
      color: #38bdf8;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    #online-count {
      text-align: center;
      color: #4ade80;
      font-size: 13px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    #messages {
      height: 380px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* スクロールバーのカスタマイズ */
    #messages::-webkit-scrollbar {
      width: 6px;
    }
    #messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    input {
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 15px;
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
    }

    #nickname {
      width: 100%;
      margin-bottom: 12px;
    }

    .send-row {
      display: flex;
      gap: 8px;
    }

    #message {
      flex: 1;
      min-width: 0;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      background: #475569;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .item {
      background: rgba(51, 65, 85, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 12px;
      overflow-wrap: anywhere;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .item strong {
      display: block;
      margin-bottom: 4px;
      color: #818cf8;
      font-size: 14px;
    }

    .item .text {
      color: #f1f5f9;
      font-size: 14px;
      line-height: 1.4;
    }

    .time {
      color: #64748b;
      font-size: 11px;
      margin-top: 6px;
      text-align: right;
    }

    #error, #pass-error {
      color: #f87171;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- ロック画面 -->
    <div id="lock-screen">
      <h1>🔒 Password Required</h1>
      <p>チャットに参加するにはパスワードを入力してください</p>
      <div class="pass-box">
        <input type="password" id="pass-input" placeholder="パスワードを入力">
        <button id="pass-btn">解除</button>
      </div>
      <p id="pass-error"></p>
    </div>

    <!-- チャット画面 -->
    <div id="chat-screen">
      <h1>💬 My Chat</h1>
      <div id="status">Firebaseに接続中...</div>
      <div id="online-count">🟢 オンライン：確認中...</div>

      <input
        id="nickname"
        maxlength="20"
        placeholder="ニックネーム（20文字以内）"
      >

      <div id="messages" aria-live="polite"></div>

      <div class="send-row">
        <input
          id="message"
          maxlength="500"
          placeholder="メッセージを入力"
          autocomplete="off"
        >
        <button id="send" disabled>送信</button>
      </div>

      <p id="error" role="alert"></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const SECRET_PASSWORD = "galaxsyasa";

    const lockScreen = document.getElementById("lock-screen");
    const chatScreen = document.getElementById("chat-screen");
    const passInput = document.getElementById("pass-input");
    const passBtn = document.getElementById("pass-btn");
    const passError = document.getElementById("pass-error");

    const nickname = document.getElementById("nickname");
    const message = document.getElementById("message");
    const messages = document.getElementById("messages");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const error = document.getElementById("error");
    const onlineCount = document.getElementById("online-count");

    let rtdb;
    let db;
    let ready = false;
    let sending = false;

    // パスワード認証処理
    function checkPassword() {
      if (passInput.value === SECRET_PASSWORD) {
        unlockChat();
      } else {
        passError.textContent = "パスワードが違います";
        passInput.value = "";
        passInput.focus();
      }
    }

    function unlockChat() {
      lockScreen.style.display = "none";
      chatScreen.style.display = "block";
      startChat();
    }

    passBtn.addEventListener("click", checkPassword);
    passInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkPassword();
    });

    // 毎回必ずパスワード入力を求めるため、ここではチェックせずフォーカスだけ当てる
    passInput.focus();

    nickname.value = localStorage.getItem("chatNickname") || "";

    nickname.addEventListener("input", () => {
      localStorage.setItem("chatNickname", nickname.value.slice(0, 20));
    });

    function showError(text) {
      error.textContent = text;
    }

    function showMessage(doc) {
      const data = doc.data();
      const item = document.createElement("div");
      item.className = "item";

      const name = document.createElement("strong");
      name.textContent = (data.name || "名無し");

      const text = document.createElement("div");
      text.className = "text";
      text.textContent = data.text || "";

      item.append(name, text);

      if (data.createdAt && data.createdAt.toDate) {
        const time = document.createElement("div");
        time.className = "time";
        time.textContent = data.createdAt.toDate().toLocaleString("ja-JP");
        item.appendChild(time);
      }

      messages.appendChild(item);
    }

    async function startChat() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }

        db = firebase.firestore();

        status.textContent = "匿名ログイン中...";

        await firebase.auth().signInAnonymously();

        rtdb = firebase.database();

        const uid = firebase.auth().currentUser.uid;
        const myStatusRef = rtdb.ref("status/" + uid);

        await myStatusRef.onDisconnect().set({
          state: "offline",
          last_changed: firebase.database.ServerValue.TIMESTAMP
        });

        await myStatusRef.set({
          state: "online",
          last_changed: firebase.database.ServerValue.TIMESTAMP
        });

        rtdb.ref("status").on("value", (snapshot) => {
          let count = 0;

          snapshot.forEach((child) => {
            if (child.child("state").val() === "online") {
              count++;
            }
          });

          onlineCount.textContent = "🟢 オンライン：" + count + "人";
        }, (err) => {
          console.error("オンライン人数の取得エラー:", err);
          onlineCount.textContent = "オンライン人数を取得できません";
        });

        status.textContent = "🟢 接続しました";
        ready = true;
        send.disabled = false;

        db.collection("messages")
          .orderBy("createdAt", "desc")
          .limit(100)
          .onSnapshot(
            (snapshot) => {
              messages.replaceChildren();

              snapshot.docs.slice().reverse().forEach(showMessage);
              messages.scrollTop = messages.scrollHeight;

              showError("");
            },
            (err) => {
              console.error("読み込みエラー:", err);
              status.textContent = "メッセージを読み込めません";
              showError("読み込みエラー: " + err.message);
            }
          );

      } catch (err) {
        console.error("接続エラー:", err);
        status.textContent = "接続できません";
        showError(
          "接続エラー: " + err.message +
          "\nFirebase設定、匿名ログイン、Firestoreルールを確認してください。"
        );
      }
    }

    async function sendMessage() {
      if (!ready || sending) return;

      const name = nickname.value.trim().slice(0, 20) || "名無し";
      const text = message.value.trim();

      if (!text) return;

      if (text.length > 500) {
        showError("メッセージは500文字以内にしてね。");
        return;
      }

      sending = true;
      send.disabled = true;
      showError("");

      try {
        await db.collection("messages").add({
          name: name,
          text: text,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        message.value = "";
        message.focus();

      } catch (err) {
        console.error("送信エラー:", err);
        showError("送信できませんでした: " + err.message);

      } finally {
        sending = false;
        send.disabled = !ready;
      }
    }

    send.addEventListener("click", sendMessage);

    message.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    const firebaseConfig = {
      apiKey: "AIzaSyD6WQiYyy9efPkwkHmne9lG4zAivW1ZbG0",
      authDomain: "asahub-chat.firebaseapp.com",
      projectId: "asahub-chat",
      databaseURL: "https://asahub-chat-default-rtdb.firebaseio.com",
      storageBucket: "asahub-chat.firebasestorage.app",
      messagingSenderId: "455399020344",
      appId: "1:455399020344:web:f399fcbcf5734c101fd3cd"
    };
  </script>
</body>
</html>
