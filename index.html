<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Chat</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 30px 12px;
    }

    .chat {
      max-width: 500px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px #0001;
    }

    h1 { text-align: center; color: #333; }

    #status {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-bottom: 12px;
    }

    #messages {
      height: 350px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 15px;
    }

    input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      max-width: 100%;
    }

    #nickname {
      width: 100%;
      margin-bottom: 12px;
    }

    .send-row {
      display: flex;
      gap: 8px;
    }

    #message {
      flex: 1;
      min-width: 0;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #5865f2;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .item {
      background: #eef0ff;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }

    .item strong {
      display: block;
      margin-bottom: 4px;
    }

    .time {
      color: #777;
      font-size: 11px;
      margin-top: 6px;
    }

    #error {
      color: #c62828;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="chat"><h1>💬 My Chat</h1>
<div id="status">Firebaseに接続中...</div>
<div id="online-count">🟢 オンライン：確認中...</div>

    <input
      id="nickname"
      maxlength="20"
      placeholder="ニックネーム（20文字以内）"
    >

    <div id="messages" aria-live="polite"></div>

    <div class="send-row">
      <input
        id="message"
        maxlength="500"
        placeholder="メッセージを入力"
        autocomplete="off"
      >
      <button id="send" disabled>送信</button>
    </div>

    <p id="error" role="alert"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD6WQiYyy9efPkwkHmne9lG4zAivW1ZbG0",
      authDomain: "asahub-chat.firebaseapp.com",
      projectId: "asahub-chat",
      databaseURL: "https://asahub-chat-default-rtdb.firebaseio.com",
      storageBucket: "asahub-chat.firebasestorage.app",
      messagingSenderId: "455399020344",
      appId: "1:455399020344:web:f399fcbcf5734c101fd3cd"
    };

    const nickname = document.getElementById("nickname");
    const message = document.getElementById("message");
    const messages = document.getElementById("messages");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const error = document.getElementById("error");
    const onlineCount = document.getElementById("online-count");
let rtdb;

    let db;
    let ready = false;
    let sending = false;

    nickname.value = localStorage.getItem("chatNickname") || "";

    nickname.addEventListener("input", () => {
      localStorage.setItem("chatNickname", nickname.value.slice(0, 20));
    });

    function showError(text) {
      error.textContent = text;
    }

    function showMessage(doc) {
      const data = doc.data();
      const item = document.createElement("div");
      item.className = "item";

      const name = document.createElement("strong");
      name.textContent = (data.name || "名無し") + "：";

      const text = document.createElement("div");
      text.textContent = data.text || "";

      item.append(name, text);

      if (data.createdAt && data.createdAt.toDate) {
        const time = document.createElement("div");
        time.className = "time";
        time.textContent = data.createdAt.toDate().toLocaleString("ja-JP");
        item.appendChild(time);
      }

      messages.appendChild(item);
    }

    async function startChat() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }

        db = firebase.firestore();

        status.textContent = "匿名ログイン中...";

        await firebase.auth().signInAnonymously();
                // Realtime Databaseに接続
        rtdb = firebase.database();

        // 自分のオンライン状態を記録
        const uid = firebase.auth().currentUser.uid;
        const myStatusRef = rtdb.ref("status/" + uid);

        // 接続が切れたらオフラインにする
        await myStatusRef.onDisconnect().set({
          state: "offline",
          last_changed: firebase.database.ServerValue.TIMESTAMP
        });

        // オンライン状態にする
        await myStatusRef.set({
          state: "online",
          last_changed: firebase.database.ServerValue.TIMESTAMP
        });

        // オンラインの人数を数える
        rtdb.ref("status").on("value", (snapshot) => {
          let count = 0;

          snapshot.forEach((child) => {
            if (child.child("state").val() === "online") {
              count++;
            }
          });

          onlineCount.textContent = "🟢 オンライン：" + count + "人";
        }, (err) => {
          console.error("オンライン人数の取得エラー:", err);
          onlineCount.textContent = "オンライン人数を取得できません";
        });

        status.textContent = "🟢 接続しました";
        ready = true;
        send.disabled = false;

        db.collection("messages")
          .orderBy("createdAt", "desc")
          .limit(100)
          .onSnapshot(
            (snapshot) => {
              messages.replaceChildren();

              snapshot.docs.slice().reverse().forEach(showMessage);
              messages.scrollTop = messages.scrollHeight;

              showError("");
            },
            (err) => {
              console.error("読み込みエラー:", err);
              status.textContent = "メッセージを読み込めません";
              showError("読み込みエラー: " + err.message);
            }
          );

      } catch (err) {
        console.error("接続エラー:", err);
        status.textContent = "接続できません";
        showError(
          "接続エラー: " + err.message +
          "\nFirebase設定、匿名ログイン、Firestoreルールを確認してください。"
        );
      }
    }

    async function sendMessage() {
      if (!ready || sending) return;

      const name = nickname.value.trim().slice(0, 20) || "名無し";
      const text = message.value.trim();

      if (!text) return;

      if (text.length > 500) {
        showError("メッセージは500文字以内にしてね。");
        return;
      }

      sending = true;
      send.disabled = true;
      showError("");

      try {
        await db.collection("messages").add({
          name: name,
          text: text,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        message.value = "";
        message.focus();

      } catch (err) {
        console.error("送信エラー:", err);
        showError("送信できませんでした: " + err.message);

      } finally {
        sending = false;
        send.disabled = !ready;
      }
    }

    send.addEventListener("click", sendMessage);

    message.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    startChat();
  </script>
</body>
</html>
